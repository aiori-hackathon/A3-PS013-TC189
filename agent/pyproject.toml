[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybertrace-agent"
version = "0.3.0"
description = "CyberTrace Linux endpoint collection agent"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cybertrace-agent = "cybertrace_agent.cli:main"

[tool.setuptools]
packages = ["cybertrace_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
